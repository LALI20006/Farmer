<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="40%" stop-color="#064E3B" />
      <stop offset="80%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#042F2E" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Filter for soft shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 56px; font-weight: 800; fill: #FFFFFF; letter-spacing: -1.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 400; fill: #A7F3D0; letter-spacing: 0.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #D1FAE5; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #FFFFFF; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #6EE7B7; text-transform: uppercase; letter-spacing: 1px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="400" rx="16" fill="url(#glow)" />

  <!-- Decorative Agriculture Pattern Rings -->
  <circle cx="1100" cy="80" r="220" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.2" />
  <circle cx="1100" cy="80" r="160" fill="none" stroke="#34D399" stroke-width="2" opacity="0.25" />
  <circle cx="1100" cy="80" r="100" fill="none" stroke="#6EE7B7" stroke-width="1" stroke-dasharray="4 6" opacity="0.3" />

  <!-- Top Pill Tag -->
  <g transform="translate(80, 52)">
    <rect width="260" height="32" rx="16" fill="#065F46" stroke="#34D399" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#34D399" />
    <text x="32" y="21" class="tagline">DIRECT FARM-TO-TABLE PLATFORM</text>
  </g>

  <!-- Logo Mark + Sprout Icon -->
  <g transform="translate(80, 105)">
    <!-- Sprout Logo Glyph -->
    <circle cx="36" cy="36" r="36" fill="#10B981" filter="url(#dropShadow)" />
    <!-- Leaf 1 -->
    <path d="M 36 44 C 24 34 22 18 36 14 C 44 24 40 38 36 44 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Leaf 2 -->
    <path d="M 36 44 C 48 36 52 24 42 18 C 36 26 36 36 36 44 Z" fill="#A7F3D0" />
    <!-- Sprout Stem -->
    <path d="M 36 44 L 36 58" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

    <!-- Title & Subtitle -->
    <text x="92" y="44" class="title">Agro<tspan fill="url(#accentGrad)">Connect</tspan></text>
    <text x="94" y="80" class="subtitle">Empowering Regional Producers with Transparent Direct-to-Consumer Trade</text>
  </g>

  <!-- Quick Feature Badges -->
  <g transform="translate(80, 220)">
    <!-- Badge 1: React 18 -->
    <rect x="0" y="0" width="135" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#34D399" stroke-width="1" />
    <text x="67" y="21" class="badge-text" text-anchor="middle">⚛️ React 18 SPA</text>

    <!-- Badge 2: Streamlit Cloud -->
    <rect x="147" y="0" width="165" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#34D399" stroke-width="1" />
    <text x="229" y="21" class="badge-text" text-anchor="middle">👑 Streamlit Ready</text>

    <!-- Badge 3: WebCrypto SHA-256 -->
    <rect x="324" y="0" width="185" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#34D399" stroke-width="1" />
    <text x="416" y="21" class="badge-text" text-anchor="middle">🔐 WebCrypto SHA-256</text>

    <!-- Badge 4: Zero Middlemen -->
    <rect x="521" y="0" width="155" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FCD34D" stroke-width="1" />
    <text x="598" y="21" class="badge-text" text-anchor="middle">🌾 Zero Middlemen</text>
  </g>

  <!-- Telemetry Metrics Bar (Bottom) -->
  <g transform="translate(80, 285)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="75" rx="10" fill="url(#cardGrad)" stroke="#34D399" stroke-opacity="0.2" stroke-width="1" />
      <text x="20" y="38" class="stat-val">100+</text>
      <text x="20" y="58" class="stat-lbl">Curated Farm Items</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(260, 0)">
      <rect width="240" height="75" rx="10" fill="url(#cardGrad)" stroke="#34D399" stroke-opacity="0.2" stroke-width="1" />
      <text x="20" y="38" class="stat-val">8 States</text>
      <text x="20" y="58" class="stat-lbl">Direct Sourcing</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(520, 0)">
      <rect width="240" height="75" rx="10" fill="url(#cardGrad)" stroke="#34D399" stroke-opacity="0.2" stroke-width="1" />
      <text x="20" y="38" class="stat-val">100%</text>
      <text x="20" y="58" class="stat-lbl">Direct Farmer Payout</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(780, 0)">
      <rect width="260" height="75" rx="10" fill="url(#cardGrad)" stroke="#34D399" stroke-opacity="0.2" stroke-width="1" />
      <text x="20" y="38" class="stat-val">Instant</text>
      <text x="20" y="58" class="stat-lbl">UPI • COD • Net Banking</text>
    </g>
  </g>
</svg>
